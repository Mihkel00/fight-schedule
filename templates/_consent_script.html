{# The consent bar's behaviour (_consent_bar.html). Accept and Decline carry equal weight; the choice is kept in
   localStorage. Declining (also later, from the footer's Cookie settings or the privacy page) removes GA cookies. -#}
<script>
(function () {
    var box = document.getElementById('fs-consent');
    function stored() { try { return localStorage.getItem('fs-consent'); } catch (e) { return null; } }
    function clearGaCookies() {
        var host = location.hostname.replace(/^www\./, '');
        document.cookie.split(';').forEach(function (c) {
            var name = c.split('=')[0].trim();
            if (name.indexOf('_ga') === 0) {
                ['', '; domain=' + host, '; domain=.' + host].forEach(function (d) {
                    document.cookie = name + '=; Max-Age=0; path=/' + d;
                });
            }
        });
    }
    function choose(value) {
        try { localStorage.setItem('fs-consent', value); } catch (e) {}
        box.hidden = true;
        if (value === 'granted') {
            if (window.fsLoadAnalytics) window.fsLoadAnalytics();
        } else {
            window['ga-disable-' + window.FS_GA_ID] = true;
            clearGaCookies();
        }
    }
    box.querySelectorAll('[data-consent]').forEach(function (b) {
        b.addEventListener('click', function () { choose(b.dataset.consent); });
    });
    window.fsShowConsent = function () { box.hidden = false; };
    if (!stored()) box.hidden = false;
})();
</script>
